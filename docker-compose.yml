services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sanrachna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sanrachna_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sanrachna}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanrachna"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      COHERE_API_KEY: ${COHERE_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-sk-sanrachna-master}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sanrachna}:${POSTGRES_PASSWORD:-sanrachna_secret}@postgres:5432/${POSTGRES_DB:-sanrachna}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sanrachna}:${POSTGRES_PASSWORD:-sanrachna_secret}@postgres:5432/${POSTGRES_DB:-sanrachna}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-sanrachna}:${POSTGRES_PASSWORD:-sanrachna_secret}@postgres:5432/${POSTGRES_DB:-sanrachna}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      LITELLM_BASE_URL: http://litellm:4000
      DIGITIZATION_PROVIDER: ${DIGITIZATION_PROVIDER:-auto}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
      MINERU_BIN: ${MINERU_BIN:-mineru}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_TIMEOUT_SEC: ${MINERU_TIMEOUT_SEC:-600}
      VISION_OCR_ENABLED: ${VISION_OCR_ENABLED:-true}
      VISION_OCR_MODEL: ${VISION_OCR_MODEL:-gemini-3.5-flash}
      VISION_OCR_FALLBACK_MODELS: ${VISION_OCR_FALLBACK_MODELS:-gemini-2.5-flash}
      VISION_OCR_MAX_PAGES: ${VISION_OCR_MAX_PAGES:-20}
      VISION_OCR_RENDER_SCALE: ${VISION_OCR_RENDER_SCALE:-2.0}
      VISION_OCR_TIMEOUT_SEC: ${VISION_OCR_TIMEOUT_SEC:-120}
      AUTO_TRANSLATE_QUERIES: ${AUTO_TRANSLATE_QUERIES:-true}
      RERANK_MODEL: ${RERANK_MODEL:-rerank-v3.5}
      ENABLE_COHERE_RERANK: ${ENABLE_COHERE_RERANK:-false}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      UPLOAD_DIR: /app/data/uploads
      OUTPUT_DIR: /app/data/outputs
    volumes:
      - upload_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sanrachna}:${POSTGRES_PASSWORD:-sanrachna_secret}@postgres:5432/${POSTGRES_DB:-sanrachna}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-sanrachna}:${POSTGRES_PASSWORD:-sanrachna_secret}@postgres:5432/${POSTGRES_DB:-sanrachna}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      LITELLM_BASE_URL: http://litellm:4000
      DIGITIZATION_PROVIDER: ${DIGITIZATION_PROVIDER:-auto}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
      MINERU_BIN: ${MINERU_BIN:-mineru}
      MINERU_BACKEND: ${MINERU_BACKEND:-pipeline}
      MINERU_TIMEOUT_SEC: ${MINERU_TIMEOUT_SEC:-600}
      VISION_OCR_ENABLED: ${VISION_OCR_ENABLED:-true}
      VISION_OCR_MODEL: ${VISION_OCR_MODEL:-gemini-3.5-flash}
      VISION_OCR_FALLBACK_MODELS: ${VISION_OCR_FALLBACK_MODELS:-gemini-2.5-flash}
      VISION_OCR_MAX_PAGES: ${VISION_OCR_MAX_PAGES:-20}
      VISION_OCR_RENDER_SCALE: ${VISION_OCR_RENDER_SCALE:-2.0}
      VISION_OCR_TIMEOUT_SEC: ${VISION_OCR_TIMEOUT_SEC:-120}
      AUTO_TRANSLATE_QUERIES: ${AUTO_TRANSLATE_QUERIES:-true}
      RERANK_MODEL: ${RERANK_MODEL:-rerank-v3.5}
      ENABLE_COHERE_RERANK: ${ENABLE_COHERE_RERANK:-false}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      UPLOAD_DIR: /app/data/uploads
      OUTPUT_DIR: /app/data/outputs
    volumes:
      - upload_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_healthy

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      SANRACHNA_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
  upload_data:
