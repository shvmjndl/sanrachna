[project]
name = "sanrachna"
version = "0.3.0"
description = "Indic-first document-to-knowledge API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "celery[redis]>=5.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "openai>=1.57.0",
    "qdrant-client>=1.12.0",
    "sarvamai>=0.1.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.18",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",
    "python-magic>=0.4.27",
    "streamlit>=1.41.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]
langchain = ["langchain-core>=0.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline", "services", "worker", "eval", "integrations", "mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
